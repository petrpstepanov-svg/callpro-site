<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e3e"/>
      <stop offset="50%" style="stop-color:#1a2f5c"/>
      <stop offset="100%" style="stop-color:#0f1e3e"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Abstract headset/operator shapes -->
  <circle cx="960" cy="540" r="300" fill="none" stroke="rgba(255,107,53,0.08)" stroke-width="2"/>
  <circle cx="960" cy="540" r="200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="960" cy="540" r="400" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Sound waves -->
  <path d="M 660 540 Q 660 440 760 440 Q 860 440 860 540 Q 860 640 760 640 Q 660 640 660 540" fill="none" stroke="rgba(255,107,53,0.15)" stroke-width="2"/>
  <path d="M 1060 540 Q 1060 440 1160 440 Q 1260 440 1260 540 Q 1260 640 1160 640 Q 1060 640 1060 540" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Dots -->
  <circle cx="200" cy="200" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="1700" cy="300" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="400" cy="800" r="2" fill="rgba(255,107,53,0.4)"/>
  <circle cx="1500" cy="900" r="3" fill="rgba(255,255,255,0.15)"/>
  <circle cx="1200" cy="150" r="2" fill="rgba(255,107,53,0.3)"/>
  <circle cx="300" cy="500" r="1.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="1600" cy="700" r="2" fill="rgba(255,255,255,0.25)"/>
</svg>
